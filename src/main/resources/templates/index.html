<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planificador de Metas</title>
    <style>
        :root {
            --bg: #faf6f0;
            --card: #ffffff;
            --accent: #c1622f;
            --accent-dark: #9c4a1f;
            --text: #2b2420;
            --muted: #7a6f65;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, 'Segoe UI', serif;
            background: linear-gradient(180deg, #faf6f0 0%, #f1e6d8 100%);
            color: var(--text);
        }
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 560px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 { font-size: 2rem; margin-bottom: 8px; }
        p.subtitle { color: var(--muted); margin-bottom: 32px; font-size: 1.05rem; }
        textarea {
            width: 100%;
            min-height: 90px;
            border-radius: 12px;
            border: 1px solid #e3d8c9;
            padding: 14px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 20px;
        }
        textarea:focus { outline: none; border-color: var(--accent); }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 999px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-dark); }
        button:disabled { background: var(--muted); cursor: wait; }
        .examples { margin-top: 24px; font-size: 0.9rem; color: var(--muted); }
        #loading {
            display: none;
            margin-top: 20px;
            color: var(--accent-dark);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎯 Planificador de Metas</h1>
        <p class="subtitle">Escribe cualquier meta y te armamos el plan paso a paso, con investigacion actualizada.</p>
        <form action="/plan" method="post" onsubmit="startLoading(this)">
            <textarea name="goal" placeholder="Ej: mudarme a Tailandia, comprar un Tesla, abrir un negocio de comida..." required></textarea>
            <br>
            <button type="submit" id="submitBtn">Buscar mi plan</button>
            <div id="loading">🔎 Investigando tu meta, esto puede tomar un minuto...</div>
        </form>
        <p class="examples">✈️ Viajes · 🚗 Compras grandes · 🏠 Mudanzas · 💼 Negocios</p>
    </div>
    <script>
        function startLoading(form) {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerText = 'Buscando...';
            document.getElementById('loading').style.display = 'block';
        }
    </script>
</body>
</html>
