<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${goal}">Tu plan</title>
    <style>
        :root {
            --bg: #faf6f0;
            --card: #ffffff;
            --accent: #c1622f;
            --accent-dark: #9c4a1f;
            --text: #2b2420;
            --muted: #7a6f65;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Georgia, 'Segoe UI', serif;
            background: var(--bg);
            color: var(--text);
        }
        .hero {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            height: 260px;
            gap: 4px;
        }
        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .hero-title {
            text-align: center;
            padding: 32px 20px 8px;
        }
        .hero-title h1 { font-size: 1.8rem; margin: 0 0 4px; }
        .hero-title span { color: var(--muted); }
        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 24px 80px;
        }
        .plan {
            background: var(--card);
            border-radius: 16px;
            padding: 32px 36px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            line-height: 1.65;
        }
        .plan h2 { color: var(--accent-dark); border-bottom: 2px solid #f1e2d0; padding-bottom: 8px; margin-top: 36px; }
        .plan h2:first-child { margin-top: 0; }
        .plan h3 { color: var(--accent); margin-top: 24px; }
        .plan table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        .plan th, .plan td { border: 1px solid #e8ddce; padding: 8px 12px; text-align: left; }
        .plan th { background: #f7efe4; }
        .plan ul, .plan ol { padding-left: 22px; }
        .plan li { margin-bottom: 6px; }
        .back {
            display: inline-block;
            margin-top: 28px;
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }
        .back:hover { color: var(--accent-dark); }
    </style>
</head>
<body>
    <div class="hero">
        <img th:each="img : ${images}" th:src="${img}" alt="imagen de referencia">
    </div>
    <div class="hero-title">
        <h1 th:text="${goal}">Meta</h1>
        <span>Tu plan paso a paso</span>
    </div>
    <div class="container">
        <div class="plan" th:utext="${planHtml}">Plan aqui</div>
        <a class="back" href="/">← Buscar otra meta</a>
    </div>
</body>
</html>
